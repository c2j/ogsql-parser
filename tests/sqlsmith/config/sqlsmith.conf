# ============================================================
# SQLsmith 配置 / SQLsmith configuration
# ============================================================
# 被 bin/corpus-gen.sh 以 shell 变量形式 source。
# Sourced by bin/corpus-gen.sh as shell variables.
# ============================================================

# 首次冷启动用单 seed × 5000 条，避免一次性产出过多失败案例
# 后续稳定后可恢复成多 seed 配置：
# SEEDS=(42 1729 2718 31415 99991)
SEEDS=(42)

# 每个 seed 生成的语句数 / queries per seed
MAX_QUERIES=5000

# 不使用 catalog 表生成查询（避免大量 pg_catalog.* 调用）
EXCLUDE_CATALOG=1

# postgres 连接参数（仅 host port 等用于健康检查；sqlsmith 通过容器内 DNS 访问）
PG_HOST="${PG_HOST:-127.0.0.1}"
PG_PORT="${PG_PORT:-15432}"
PG_USER="${PG_USER:-sqlsmith}"
PG_DB="${PG_DB:-sqlsmith}"
PG_PASSWORD="${PG_PASSWORD:-sqlsmith}"
